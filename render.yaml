# Render blueprint -- free-tier native Python web service (no Docker).
# Deploy root is this dashboard/ folder (app.py, requirements.txt and render.yaml sit together).
# If you deploy from a monorepo, set `rootDir: P2/dashboard` on the service instead.
services:
  - type: web
    name: aiops-mission-control
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # bind 0.0.0.0 and the platform-supplied $PORT; nothing hardcodes 8000
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # serve the slim, committed database (the full store is git-ignored and never deployed)
      - key: DEMO_DB
        value: data/demo_lite.sqlite
      # pin the interpreter; bump the patch if Render does not offer this exact build
      - key: PYTHON_VERSION
        value: "3.13.4"
